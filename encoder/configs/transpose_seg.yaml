# Thermal encoder pretraining by glass segmentation: python -m encoder.train --config <this> [key=value ...]
seed: 0
init: scratch              # scratch | imagenet (RGB conv1 averaged to 1 channel)
out_dir: data/outputs/encoder/${init}_seed${seed}
device: cuda

data:
  name: transpose          # transpose | random (synthetic smoke test)
  root: null               # TRansPose root; not needed once cache_dir holds every sequence
  cache_dir: data/transpose_cache   # per-sequence npz: resized raw counts, masks, CNR
  sequences: null          # null = every sequence under root
  val_sequences: null      # null = seeded random val_frac of the sequences
  val_frac: 0.2
  image_size: 96           # frames resized to the DP obs size
  crop_size: 84            # train random crop / val center crop (DP crop_shape)
  norm_mode: fixed         # common/thermal.py: fixed | centered | percentile | minmax
  norm_params: null        # e.g. {range: [lo, hi]}; null = the mode default in common/thermal.py
  n_random: 320            # frames when name=random

aug:
  scale: [0.8, 1.0]        # crop side / image_size, then resized to crop_size
  hflip: true
  gain: [0.9, 1.1]
  offset: 0.05
  noise: 0.01

train:
  epochs: 40
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 4
  amp: true

eval:
  cnr_edges: null          # [low|mid, mid|high] thresholds; null = train-split CNR tertiles
  n_vis: 12
