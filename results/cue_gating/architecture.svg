<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="575" viewBox="0 0 1350 575" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2E7D4F"/>
    </marker>
    <marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#C97A00"/>
    </marker>
    <style>
      .t12b { font-size: 12px; font-weight: 700; fill: #222; }
      .t11 { font-size: 11px; fill: #222; }
      .t10 { font-size: 10px; fill: #444; }
      .t9 { font-size: 9px; fill: #555; }
      .green { fill: #2E7D4F; }
      .orange { fill: #C97A00; }
      .mid { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1350" height="575" fill="#ffffff"/>

  <!-- Title -->
  <text x="25" y="38" class="t12b" style="font-size:14px">Cue-gated RGB-D-T Diffusion Policy (policy/gated_obs_encoder.py)</text>

  <!-- ===== Training-only corruption box (dashed) ===== -->
  <rect x="25" y="72" width="185" height="295" rx="8" fill="none" stroke="#2E7D4F" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="28" y="64" class="t9 green">train-only corruption (glass_dataset.Corruption): thermal contrast ↓ · depth hole blobs  — scene difficulty comes from the level (L4b)</text>

  <!-- ===== Inputs ===== -->
  <g>
    <rect x="40" y="97" width="150" height="46" rx="6" fill="#fff" stroke="#555" stroke-width="1.3"/>
    <text x="115" y="116" class="t12b mid">RGB</text>
    <text x="115" y="132" class="t10 mid">3 ch, 96×96 → shared 84 crop</text>

    <rect x="40" y="197" width="150" height="46" rx="6" fill="#fff" stroke="#555" stroke-width="1.3"/>
    <text x="115" y="216" class="t12b mid">Depth + valid mask</text>
    <text x="115" y="232" class="t10 mid">3 ch = [depth, depth&gt;0, depth]</text>

    <rect x="40" y="297" width="150" height="46" rx="6" fill="#fff" stroke="#555" stroke-width="1.3"/>
    <text x="115" y="316" class="t12b mid">Thermal</text>
    <text x="115" y="332" class="t10 mid">3 ch, calibrated centered norm</text>
  </g>

  <!-- input -> encoder arrows -->
  <line x1="190" y1="120" x2="228" y2="120" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="190" y1="220" x2="228" y2="220" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="190" y1="320" x2="228" y2="320" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Encoders ===== -->
  <g>
    <rect x="230" y="97" width="270" height="46" rx="6" fill="#ECE8FF" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="365" y="116" class="t12b mid">RGB encoder</text>
    <text x="365" y="132" class="t10 mid">ResNet18 + GroupNorm (ImageNet init), avgpool</text>

    <rect x="230" y="197" width="270" height="46" rx="6" fill="#ECE8FF" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="365" y="216" class="t12b mid">Depth encoder</text>
    <text x="365" y="232" class="t10 mid">ResNet18 + GroupNorm (ImageNet init), avgpool</text>

    <rect x="230" y="297" width="270" height="46" rx="6" fill="#ECE8FF" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="365" y="316" class="t12b mid">Thermal encoder</text>
    <text x="365" y="332" class="t10 mid">ResNet18 + GroupNorm (ImageNet / TRansPose init)</text>
  </g>

  <!-- encoder -> z arrows -->
  <line x1="500" y1="120" x2="523" y2="120" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="500" y1="220" x2="523" y2="220" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="500" y1="320" x2="523" y2="320" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Feature nodes ===== -->
  <g>
    <rect x="525" y="103" width="70" height="34" rx="17" fill="#fff" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="560" y="124" class="t11 mid">z_rgb ∈ ℝ⁵¹²</text>
    <rect x="525" y="203" width="70" height="34" rx="17" fill="#fff" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="560" y="224" class="t11 mid">z_d ∈ ℝ⁵¹²</text>
    <rect x="525" y="303" width="70" height="34" rx="17" fill="#fff" stroke="#8C7AE6" stroke-width="1.3"/>
    <text x="560" y="324" class="t11 mid">z_t ∈ ℝ⁵¹²</text>
  </g>

  <!-- z -> gate arrows -->
  <line x1="595" y1="120" x2="618" y2="120" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="595" y1="220" x2="618" y2="220" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="595" y1="320" x2="618" y2="320" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Reliability gate ===== -->
  <rect x="620" y="85" width="150" height="270" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
  <text x="695" y="101" class="t12b mid green">Reliability gate</text>
  <text x="695" y="124" class="t11 mid">w_rgb ⊙ z_rgb</text>
  <text x="695" y="224" class="t11 mid">w_d ⊙ z_d</text>
  <text x="695" y="324" class="t11 mid">w_t ⊙ z_t</text>
  <text x="695" y="345" class="t10 mid">w_m = σ( MLP_m ( c ) )   v1: cues only</text>
  <text x="695" y="170" class="t9 mid">independent sigmoid per modality</text>
  <text x="695" y="182" class="t9 mid">(no softmax competition)</text>

  <!-- gate -> fusion arrows -->
  <line x1="770" y1="120" x2="798" y2="120" stroke="#2E7D4F" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="770" y1="220" x2="798" y2="220" stroke="#2E7D4F" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="770" y1="320" x2="798" y2="320" stroke="#2E7D4F" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- ===== Gated concat + conditioning ===== -->
  <rect x="800" y="85" width="190" height="270" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
  <text x="895" y="101" class="t12b mid green">Gated concat + cond</text>
  <text x="895" y="150" class="t11 mid">ẑ = [ w_rgb·z_rgb ;</text>
  <text x="895" y="166" class="t11 mid">w_d·z_d ; w_t·z_t ]</text>
  <text x="895" y="183" class="t9 mid">modality-specific channels kept</text>
  <text x="895" y="225" class="t11 mid">cond = [ ẑ ; w ; s ]</text>
  <text x="895" y="241" class="t10 mid">× T_o = 2 observation steps</text>
  <text x="895" y="300" class="t9 mid">w enters cond → policy knows</text>
  <text x="895" y="312" class="t9 mid">which sensor it is trusting</text>

  <!-- Robot state -->
  <rect x="800" y="395" width="190" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="895" y="411" class="t12b mid">Robot state s</text>
  <text x="895" y="426" class="t10 mid">7-D joint angles + gripper</text>
  <line x1="895" y1="395" x2="895" y2="357" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- fusion -> U-Net -->
  <line x1="990" y1="220" x2="1028" y2="220" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1009" y="211" class="t10 mid">FiLM</text>

  <!-- ===== Denoiser ===== -->
  <rect x="1030" y="140" width="150" height="160" rx="8" fill="#F1F1F1" stroke="#666" stroke-width="1.5"/>
  <text x="1105" y="168" class="t12b mid">1D temporal U-Net</text>
  <text x="1105" y="188" class="t10 mid">FiLM-conditioned residual blocks</text>
  <text x="1105" y="206" class="t10 mid">DDPM, 100 steps (train)</text>
  <text x="1105" y="222" class="t10 mid">DDPM, 100 steps (eval, as DP)</text>
  <text x="1105" y="262" class="t11 mid">ε_θ( a^k , k , cond )</text>
  <text x="1105" y="284" class="t9 mid">unchanged from DP baseline</text>

  <!-- noisy action in -->
  <text x="1105" y="114" class="t10 mid">noisy chunk a^k, step k</text>
  <line x1="1105" y1="118" x2="1105" y2="138" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- U-Net -> action -->
  <line x1="1180" y1="220" x2="1213" y2="220" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Action chunk ===== -->
  <rect x="1215" y="197" width="110" height="46" rx="6" fill="#F1F1F1" stroke="#666" stroke-width="1.5"/>
  <text x="1270" y="216" class="t12b mid">Action chunk</text>
  <text x="1270" y="232" class="t10 mid">16 predicted, 8 executed</text>

  <!-- ===== Reliability cues (bypass) ===== -->
  <rect x="40" y="400" width="150" height="66" rx="6" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
  <text x="115" y="416" class="t12b mid green">Reliability cues</text>
  <text x="115" y="432" class="t10 mid">c_t : log contrast / noise, extent</text>
  <text x="115" y="446" class="t10 mid">c_d : valid fraction, roughness</text>
  <text x="115" y="460" class="t10 mid">c_rgb : brightness, sharpness</text>

  <!-- thermal raw -> cues (bypass) -->
  <line x1="115" y1="343" x2="115" y2="398" stroke="#2E7D4F" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <text x="121" y="380" class="t9 green">raw counts, before normalization</text>

  <!-- depth -> cues -->
  <polyline points="40,230 18,230 18,446 38,446" fill="none" stroke="#2E7D4F" stroke-width="1.2" marker-end="url(#arrowG)"/>

  <!-- cues -> gate -->
  <polyline points="190,433 660,433 660,357" fill="none" stroke="#2E7D4F" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <text x="330" y="446" class="t9 green">cue vector c (6) → every gate (cross-modal)</text>

  <!-- ===== Targeted modality dropout (train only) ===== -->
  <rect x="525" y="22" width="245" height="38" rx="6" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="647" y="37" class="t11 mid orange">Targeted modality dropout (train only)</text>
  <text x="647" y="52" class="t10 mid">dropped m (highest w, p=0.3) :  z_m ← e_miss,  w_m ← 0</text>
  <line x1="560" y1="60" x2="560" y2="101" stroke="#C97A00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>

  <!-- ===== Logging hook ===== -->
  <rect x="800" y="22" width="190" height="38" rx="6" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="895" y="37" class="t10 mid">log w_m every step →</text>
  <text x="895" y="52" class="t10 mid">w_t vs ΔT, phase-wise w_m</text>
  <line x1="800" y1="48" x2="745" y2="84" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ===== Losses (dashed orange) ===== -->
  <!-- L_aux -->
  <rect x="430" y="382" width="180" height="42" rx="6" fill="#FFF4E5" stroke="#C97A00" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="520" y="398" class="t11 mid orange">L_aux : unimodal action heads (×0.1)</text>
  <text x="520" y="413" class="t10 mid">on [ z_m ; s ] → next 8 actions; keeps every encoder learning</text>
  <line x1="560" y1="337" x2="560" y2="380" stroke="#C97A00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>

  <!-- L_gate -->
  <rect x="640" y="470" width="200" height="42" rx="6" fill="#FFF4E5" stroke="#C97A00" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="740" y="486" class="t11 mid orange">L_gate (sim-only, annealed → 0)</text>
  <text x="740" y="501" class="t10 mid">w_t ↔ tanh(|ΔT| / 5 °C), ΔT from zarr meta</text>
  <line x1="710" y1="470" x2="710" y2="357" stroke="#C97A00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>

  <!-- L_ddpm -->
  <rect x="1030" y="470" width="150" height="42" rx="6" fill="#FFF4E5" stroke="#C97A00" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="1105" y="486" class="t11 mid orange">L_ddpm (main)</text>
  <text x="1105" y="501" class="t10 mid">‖ ε − ε_θ(a^k, k, cond) ‖²</text>
  <line x1="1105" y1="300" x2="1105" y2="468" stroke="#C97A00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowO)"/>

  <!-- ===== Legend ===== -->
  <rect x="40" y="495" width="14" height="14" fill="#ECE8FF" stroke="#8C7AE6"/>
  <text x="60" y="506" class="t10">Encoders — same architecture, separate weights per modality</text>
  <rect x="40" y="520" width="14" height="14" fill="#E6F4EA" stroke="#2E7D4F"/>
  <text x="60" y="531" class="t10">Reliability-aware fusion (proposed; the only part changed vs. static-concat baseline)</text>
  <rect x="40" y="545" width="14" height="14" fill="#F1F1F1" stroke="#666"/>
  <text x="60" y="556" class="t10">Diffusion Policy denoiser and training recipe — unchanged</text>
  <rect x="430" y="545" width="14" height="14" fill="#FFF4E5" stroke="#C97A00" stroke-dasharray="4,3"/>
  <text x="450" y="556" class="t10">Dashed orange — training-time only (losses, dropout, corruption)</text>
</svg>
