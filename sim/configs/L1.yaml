# L1 = lever A (weaker RGB): fainter, slightly tinted glass. MuJoCo renders glass by alpha blending only, without
# refraction, caustics or Fresnel edges, which makes rendered glass easier to see than real glass at alpha 0.2;
# a lower alpha plus glass-like (sky-blue / white) tables and dim / back light stand in for that.
base: hard_base.yaml
name: L1
level: 1
alpha: [0.05, 0.1]
tint: 0.05
