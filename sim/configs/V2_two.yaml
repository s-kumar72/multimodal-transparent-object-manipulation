# Second version of the visibility benchmark, task T3 (results/hard_scenario/bench_v2/README.md; a draft level, not
# frozen): two glasses of different shapes stand on the table and there are two coasters; put one glass on each, in any
# order. Each glass has its own visibility states, so the sensors that show the first need not show the second. Scenes
# and sensor states as V2_place. A cell is a pair: [weight, rgb, depth, thermal of the first glass, rgb, depth, thermal
# of the second]; 0 shows, 1 blind, 2 faint. Weights sum to 140 (700 demos = 5 x 140). meta/ep_level id 41.
base: V2_place.yaml
name: V2_two
level: 41
task: two
n_distractors: [0, 2]    # two glasses and two coasters need the room (1 to 3 in the other tasks)
cells:
  - [20, 0, 0, 0, 0, 0, 0]    # 0  both shown by all three
  - [8, 1, 0, 1, 1, 0, 1]     # 1  both by depth alone
  - [8, 1, 1, 0, 1, 1, 0]     # 2  both by thermal alone
  - [8, 0, 1, 1, 0, 1, 1]     # 3  both by colour alone
  - [12, 1, 0, 1, 1, 1, 0]    # 4  the first by depth alone, the second by thermal alone
  - [12, 1, 0, 1, 0, 1, 1]    # 5  depth alone, colour alone
  - [12, 1, 1, 0, 0, 1, 1]    # 6  thermal alone, colour alone
  - [12, 1, 0, 0, 0, 1, 1]    # 7  depth and thermal, colour alone
  - [12, 0, 1, 0, 1, 0, 1]    # 8  colour and thermal, depth alone
  - [12, 0, 0, 1, 1, 1, 0]    # 9  colour and depth, thermal alone
  - [12, 2, 2, 2, 2, 2, 2]    # 10 both faintly by all three
  - [12, 0, 0, 0, 2, 2, 2]    # 11 the first fully, the second faintly
